{% extends "base.html" %}
{% block title %}Voters{% endblock %}
{% block content %}
<h1 class="page-title">Voters</h1>
<p class="subtitle">Approve new voters. Personal details are partly hidden.</p>
<div id="voters-alert" aria-live="assertive"></div>
<form id="voter-filters" class="panel section" role="search">
  <div class="row g-2 align-items-end">
    <div class="col-12 col-md-4">
      <label for="f-q" class="form-label">Search</label>
      <input id="f-q" name="q" class="form-control" maxlength="80" placeholder="Name, email or voter ID">
    </div>
    <div class="col-6 col-md-2">
      <label for="f-status" class="form-label">Status</label>
      <select id="f-status" name="status" class="form-select">
        <option value="">All</option>
        <option value="pending">Pending</option>
        <option value="verified">Verified</option>
        <option value="rejected">Rejected</option>
        <option value="suspended">Suspended</option>
      </select>
    </div>
    <div class="col-6 col-md-2">
      <label for="f-lga" class="form-label">LGA</label>
      <select id="f-lga" name="lga_id" class="form-select"><option value="">All</option></select>
    </div>
    <div class="col-6 col-md-2">
      <label for="f-ward" class="form-label">Ward</label>
      <select id="f-ward" name="ward_id" class="form-select" disabled><option value="">All</option></select>
    </div>
    <div class="col-6 col-md-2"><button class="btn btn-primary w-100" type="submit">Search</button></div>
  </div>
</form>
<div id="voters-table"></div>
<nav id="voters-pager" aria-label="Pages" class="mt-3"></nav>

<div class="modal fade" id="verify-modal" tabindex="-1" aria-labelledby="verify-title" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered"><div class="modal-content p-2">
    <form id="verify-form" novalidate>
      <div class="modal-header"><h2 class="modal-title h5" id="verify-title">Change status</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
      <div class="modal-body">
        <p id="verify-desc"></p>
        <input type="hidden" name="action" id="verify-action">
        <label for="verify-reason" class="form-label">Reason <span id="reason-req" class="muted"></span></label>
        <textarea id="verify-reason" name="reason" class="form-control" maxlength="300" rows="2"></textarea>
        <div id="verify-alert" class="mt-2" aria-live="assertive"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-dark" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary" id="verify-submit">Confirm</button>
      </div>
    </form>
  </div></div>
</div>
{% endblock %}
{% block scripts %}<script type="module" src="{{ url_for('static', filename='js/pages/admin_voters.js') }}"></script>{% endblock %}
