{% extends "base.html" %}
{% block title %}Elections{% endblock %}
{% block content %}
<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
  <h1 class="page-title mb-0">Elections</h1>
  <button class="btn btn-primary" type="button" data-bs-toggle="collapse" data-bs-target="#new-election" aria-expanded="false" aria-controls="new-election">New election</button>
</div>
<div id="elections-alert" aria-live="assertive"></div>
<div class="collapse section" id="new-election">
  <form id="election-form" class="panel" novalidate>
    <h2 class="label">New election (saved as draft)</h2>
    {% include "admin/_election_form.html" %}
    <div id="election-form-alert" class="mt-3" aria-live="assertive"></div>
    <button class="btn btn-outline-dark mt-3" type="submit" id="election-submit">Save draft</button>
  </form>
</div>
<div id="elections-table"></div>
{% endblock %}
{% block scripts %}<script type="module" src="{{ url_for('static', filename='js/pages/admin_elections.js') }}"></script>{% endblock %}
