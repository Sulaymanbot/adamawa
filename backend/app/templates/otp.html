{% extends "base.html" %}
{% block title %}Enter your code{% endblock %}
{% block content %}
<div class="narrow">
  <h1 class="page-title">Enter your code</h1>
  <p class="subtitle">We sent you a 6-digit code. It expires in 5 minutes.</p>
  <div id="otp-alert" aria-live="assertive"></div>
  <form id="otp-form" class="panel" novalidate data-next="{{ next_url }}">
    <div class="mb-4">
      <label for="code" class="form-label">Code</label>
      <input id="code" name="code" class="form-control form-control-lg" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required>
      <div class="form-text">Demo: the code appears in the server window.</div>
    </div>
    <button type="submit" class="btn btn-primary btn-lg w-100" id="otp-submit">Continue</button>
    <button type="button" class="btn btn-link mt-2" id="otp-resend">Send a new code</button>
  </form>
</div>
{% endblock %}
{% block scripts %}<script type="module" src="{{ url_for('static', filename='js/pages/otp.js') }}"></script>{% endblock %}
